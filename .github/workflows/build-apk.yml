name: Gerar APK do Mestre Gordão

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Extrair projeto
        run: |
          unzip -o Mestre_Gordao_Android_2.1.zip
          cd mestre_gordao_android
          rm -rf android
          npm install
          npx cap add android
          npx cap sync android

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          cd mestre_gordao_android/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mestre-Gordao-APK
          path: mestre_gordao_android/android/app/build/outputs/apk/debug/app-debug.apk
